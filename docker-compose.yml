version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: brewlite-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_password}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite_db}
    ports:
      - "5432:5432"
    volumes:
      - brewlite-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite_user -d brewlite_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  brewlite-pgdata:
    driver: local
