services:
  postgres:
    image: postgres:16-alpine
    container_name: brewlite-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_password}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - brewlite-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: brewlite-migration
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-brewlite_user}:${POSTGRES_PASSWORD:-brewlite_password}@postgres:5432/${POSTGRES_DB:-brewlite_db}?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: brewlite-api
    restart: always
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-brewlite_user}:${POSTGRES_PASSWORD:-brewlite_password}@postgres:5432/${POSTGRES_DB:-brewlite_db}?schema=public}
      PORT: 3005
      JWT_SECRET: ${JWT_SECRET:-brewlite-super-secret-jwt-key-for-development}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3006}
      NODE_ENV: production
    ports:
      - "${API_PORT:-3005}:3005"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/api/products', (r) => process.exit(r.statusCode < 500 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3005/api}
    container_name: brewlite-web
    restart: always
    environment:
      PORT: 3006
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3005/api}
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3006}:3006"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006', (r) => process.exit(r.statusCode < 500 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  brewlite-pgdata:
    driver: local
