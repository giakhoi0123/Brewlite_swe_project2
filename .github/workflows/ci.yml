name: BrewLite CI — Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight Inspection
    runs-on: ubuntu-latest
    outputs:
      backend_present: ${{ steps.check.outputs.backend_present }}
      frontend_present: ${{ steps.check.outputs.frontend_present }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check module readiness
        id: check
        run: |
          echo "=== Preflight Module Check ==="
          FAILED=0

          if [ -f "apps/api/package.json" ] && [ -f "apps/api/package-lock.json" ]; then
            echo "backend_present=true" >> "$GITHUB_OUTPUT"
            echo "Backend module (apps/api): DETECTED"
          else
            echo "backend_present=false" >> "$GITHUB_OUTPUT"
            echo "::error::Thiếu module bắt buộc apps/api hoặc apps/api/package-lock.json"
            FAILED=1
          fi

          if [ -f "apps/web/package.json" ] && [ -f "apps/web/package-lock.json" ]; then
            echo "frontend_present=true" >> "$GITHUB_OUTPUT"
            echo "Frontend module (apps/web): DETECTED"
          else
            echo "frontend_present=false" >> "$GITHUB_OUTPUT"
            echo "::error::Thiếu module bắt buộc apps/web hoặc apps/web/package-lock.json"
            FAILED=1
          fi

          if [ $FAILED -ne 0 ]; then
            echo "Preflight check failed: Both apps/api and apps/web are mandatory for MVP."
            exit 1
          fi

  backend-ci:
    name: Backend Quality Gate (NestJS)
    needs: preflight
    if: needs.preflight.outputs.backend_present == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: 1. INSTALL — Dependencies
        working-directory: apps/api
        run: npm ci

      - name: Prisma Client Generation
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql://ci_user:ci_pass@localhost:5432/ci_db?schema=public"
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma validate
            npx prisma generate
          fi

      - name: 2. LINT — Code quality check
        working-directory: apps/api
        run: npm run lint

      - name: 3. UNIT TEST — Backend test suite
        working-directory: apps/api
        run: npm test

      - name: 4. BUILD — NestJS production build
        working-directory: apps/api
        run: npm run build

  frontend-ci:
    name: Frontend Quality Gate (Next.js)
    needs: preflight
    if: needs.preflight.outputs.frontend_present == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 1. INSTALL — Dependencies
        working-directory: apps/web
        run: npm ci

      - name: 2. LINT — ESLint check
        working-directory: apps/web
        run: npm run lint

      - name: 3. UNIT TEST — Frontend test suite
        working-directory: apps/web
        run: npm test

      - name: TypeScript Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: 4. BUILD — Next.js production build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3005/api

  summary:
    name: Quality Gate Summary
    needs: [preflight, backend-ci, frontend-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report Status
        run: |
          echo "========================================================"
          echo "           BREWLITE CI QUALITY GATE SUMMARY             "
          echo "========================================================"
          echo "Preflight check    : ${{ needs.preflight.result }}"
          echo "Backend (NestJS)   : ${{ needs.backend-ci.result }}"
          echo "Frontend (Next.js)  : ${{ needs.frontend-ci.result }}"
          echo "========================================================"

          if [ "${{ needs.preflight.result }}" != "success" ] || \
             [ "${{ needs.backend-ci.result }}" != "success" ] || \
             [ "${{ needs.frontend-ci.result }}" != "success" ]; then
            echo "::error::Quality gate FAILED. All required modules (apps/api and apps/web) must be present and pass all checks."
            exit 1
          fi

          echo "Quality gate evaluation completed successfully."
